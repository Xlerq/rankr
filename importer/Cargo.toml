[package]
name = "rankr-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "GPW fundamentals, Yahoo daily company prices and history collector"
default-run = "rankr-import"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "query", "form"] }
# Both serde features are required: exact JSON numbers, without conversion through f64.
rust_decimal = { version = "1.43", default-features = false, features = ["serde-float", "serde-arbitrary-precision", "std"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
